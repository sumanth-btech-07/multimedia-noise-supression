<!DOCTYPE html>
<html>
<head>
<title>Video Noise Suppression</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
color:white;
}

/* MAIN CARD */

.card{
background:#1e1e1e;
width:520px;
padding:40px;
border-radius:10px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.8);
}

/* TITLE */

.card h2{
margin-bottom:10px;
color:#ffffff;
}

/* SUB TEXT */

.sub{
font-size:13px;
color:#aaaaaa;
margin-bottom:25px;
}

/* FILE INPUT */

input[type=file]{
display:none;
}

/* UPLOAD BUTTON */

.upload-btn{
display:inline-block;
background:#333;
color:white;
padding:12px 28px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
border:1px solid #555;
transition:0.3s;
}

.upload-btn:hover{
background:#444;
border-color:#777;
}

/* PROGRESS AREA */

.progress-box{
margin-top:25px;
background:#2a2a2a;
padding:15px;
border-radius:6px;
display:flex;
align-items:center;
gap:10px;
}

progress{
width:100%;
height:10px;
appearance:none;
}

progress::-webkit-progress-bar {
background-color: #333;
border-radius: 5px;
}

progress::-webkit-progress-value {
background-color: #00ffcc;
border-radius: 5px;
}

/* STATUS TEXT */

#status{
font-size:14px;
color:#bbbbbb;
margin-top:8px;
}

/* VIDEO */

video{
width:100%;
margin-top:20px;
border-radius:6px;
display:none;
background:black;
}

/* DOWNLOAD BUTTON */

.download{
margin-top:15px;
background:#00c853;
border:none;
padding:12px;
width:100%;
color:white;
border-radius:6px;
cursor:pointer;
display:none;
font-weight:bold;
transition:0.3s;
}

.download:hover{
background:#00a844;
}

</style>
</head>

<body>

<div class="card">

<h2>Upload & Process Video</h2>
<div class="sub">Click button or drag & drop file</div>

<form id="uploadForm">

<label class="upload-btn">
Upload Video
<input type="file" name="video" accept="video/*" required>
</label>

<div class="progress-box">
<progress id="progress" value="0" max="100"></progress>
</div>

<div id="status">Waiting for upload...</div>

</form>

<video id="preview" controls></video>

<button class="download" id="downloadBtn" onclick="download()">
Download Video
</button>

</div>

<script>

const form = document.getElementById("uploadForm");
const progress = document.getElementById("progress");
const statusText = document.getElementById("status");
const video = document.getElementById("preview");
const downloadBtn = document.getElementById("downloadBtn");

form.onchange = async () => {

const fileInput = form.querySelector("input[type=file]");
if(!fileInput.files.length) return;

const data = new FormData();
data.append("video", fileInput.files[0]);

statusText.innerText = "Uploading...";
progress.value = 0;

await fetch("/upload", {
method: "POST",
body: data
});

/* START PROGRESS TRACKING */

const timer = setInterval(async () => {

const res = await fetch("/progress");
const p = await res.json();

progress.value = p.percent;

/* 🔥 LIVE PERCENT DISPLAY */
statusText.innerText = `Processing ${p.percent}%...`;

if(p.percent >= 100){

clearInterval(timer);

video.src = "/preview?" + new Date().getTime();
video.style.display = "block";

downloadBtn.style.display = "block";

statusText.innerText = "Processing Complete ✅";

}

}, 500);

};

function download(){
window.location.href = "/download";
}

</script>

</body>
</html>
